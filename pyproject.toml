[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-telescope-benchmark"
version = "1.0.0"
authors = [
  { name="Loren", email="lorenhey@example.com" },
]
description = "A metrological and characterization tool for radio telescopes."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pydantic",
    "typer",
    "rich",
    "astropy",
    "pandas",
    "scikit-rf",
    "streamlit",
    "jinja2"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rtb = "radio_telescope_benchmark.cli.main:app"
